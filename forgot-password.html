<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ลืมรหัสผ่าน - Baby Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body.login-page {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .login-box {
            background: #ffffff; padding: 35px 30px;
            border-radius: 16px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
            border: 1px solid #e0f2fe;
        }
        .login-box h2 {
            text-align: center; color: #0369a1; margin-bottom: 15px;
            font-weight: 600; font-size: 24px;
        }
        .desc {
            font-size: 14px; color: #64748b; text-align: center; margin-bottom: 25px; line-height: 1.5;
        }
        .input-group { margin-bottom: 20px; }
        .input-group input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #cbd5e1; border-radius: 8px;
            font-size: 15px; color: #334155; transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #0284c7; outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .btn-submit {
            width: 100%; padding: 12px; background-color: #0284c7;
            color: white; border: none; border-radius: 8px; font-size: 16px;
            font-weight: 500; cursor: pointer; transition: background 0.3s;
        }
        .btn-submit:hover { background-color: #0369a1; }
        .btn-back {
            display: block; text-align: center; width: 100%; padding: 10px;
            border-radius: 8px; text-decoration: none; font-size: 15px; margin-top: 15px;
            color: #64748b; background: transparent; transition: all 0.3s;
        }
        .btn-back:hover { color: #0f172a; }
    </style>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-box">
            <h2>รีเซ็ตรหัสผ่าน</h2>
            <p class="desc">กรอกอีเมลที่คุณใช้สมัครสมาชิก ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ไปให้ทางอีเมล</p>
            <p style="font-size: 13px; color: #d97706; text-align: center; margin-top: -15px; margin-bottom: 20px;">
                * หมายเหตุ: หากไม่พบอีเมลในกล่องข้อความหลัก กรุณาตรวจสอบในโฟลเดอร์ **อีเมลขยะ (Spam / Junk)** 
            </p>
            
            <form id="resetForm">
                <div class="input-group">
                    <input type="email" id="resetEmail" placeholder="กรอก Email ของคุณ" required>
                </div>
                
                <button type="submit" class="btn-submit">ส่งลิงก์รีเซ็ตรหัสผ่าน</button>
            </form>

            <a href="login.html" class="btn-back">กลับไปหน้าเข้าสู่ระบบ</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2QNZSSDXnIuHTFVFQn8gzx7JBWTRn8i0",
            authDomain: "babygo-database-c51bb.firebaseapp.com",
            projectId: "babygo-database-c51bb",
            storageBucket: "babygo-database-c51bb.firebasestorage.app",
            messagingSenderId: "288446121324",
            appId: "1:288446121324:web:d565a8b27893e761a8df49"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // อีเมลแอดมินที่ห้ามรีเซ็ดเด็ดขาด
        const ADMIN_EMAIL = "babygo.admin@gmail.com";

        document.getElementById("resetForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const email = document.getElementById("resetEmail").value.trim().toLowerCase();

            // ดักบล็อกทันทีถ้าเป็นเมลแอดมิน
            if (email === ADMIN_EMAIL) {
                alert("❌ ไม่อนุญาต! อีเมลนี้เป็นบัญชีผู้ดูแลระบบสูงสุด (Admin) ห้ามรีเซ็ตรหัสผ่านผ่านระบบนี้เด็ดขาด!");
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                alert("✅ ระบบได้ส่งลิงก์รีเซ็ตรหัสผ่านไปที่อีเมลของคุณแล้ว กรุณาตรวจสอบกล่องข้อความ");
                window.location.href = "login.html";
            } catch (error) {
                alert("เกิดข้อผิดพลาด: ไม่พบอีเมลนี้ในระบบ หรือรูปแบบอีเมลไม่ถูกต้อง");
            }
        });
    </script>
</body>
</html>
