<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Go - ศูนย์แจ้งเตือน</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; margin: 0; padding: 0; }
        body { background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 50%, #f8fafc 100%); color: #333333; font-size: 15px; min-height: 100vh; overflow-x: hidden; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animated-fade { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .navbar {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 12px 25px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(186, 230, 253, 0.6);
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 4px 20px rgba(14, 165, 233, 0.05);
        }
        .nav-left { display: flex; align-items: center; gap: 15px; }
        .menu-btn { font-size: 26px; cursor: pointer; color: #0284c7; background: #e0f2fe; border: none; width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .menu-btn:hover { background: #bae6fd; transform: scale(1.1) rotate(90deg); }
        
        .logo-container { display: flex; align-items: center; }
        .main-logo-img { height: 60px !important; width: auto !important; object-fit: contain !important; display: block; }

        .nav-right { display: flex; align-items: center; gap: 12px; }
        .icon-btn { font-size: 22px; cursor: pointer; background: #f0f9ff; border: 1px solid #bae6fd; width: 42px; height: 42px; border-radius: 12px; color: #0ea5e9; text-decoration: none; display: flex; align-items: center; justify-content: center; transition: all 0.2s; position: relative; overflow: hidden; }
        .icon-btn:hover { background: #e0f2fe; transform: scale(1.1); }

        .sidebar {
            position: fixed; top: 0; left: -300px; width: 300px; height: 100vh;
            background-color: #ffffff; 
            box-shadow: 6px 0 30px rgba(0,0,0,0.1);
            transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1); z-index: 200; padding: 25px 20px;
            overflow-y: auto;
        }
        .sidebar.active { left: 0; }
        .sidebar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f0f9ff; padding-bottom: 15px; }
        .sidebar-header h3 { color: #0284c7; font-weight: 700; font-size: 22px; }
        .close-btn { background: #f0f9ff; border: none; width: 38px; height: 38px; border-radius: 50%; font-size: 18px; cursor: pointer; color: #0284c7; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .close-btn:hover { background: #e0f2fe; transform: scale(1.1); }
        
        .sidebar-menu { list-style: none; display: flex; flex-direction: column; gap: 6px; }
        .sidebar-menu li a { 
            display: flex; align-items: center; gap: 15px; padding: 12px 16px; color: #334155; text-decoration: none; font-weight: 400; border-radius: 14px; transition: all 0.2s ease; 
        }
        .sidebar-menu li a:hover { background: #f0f9ff; color: #0284c7; transform: translateX(4px); }
        .sidebar-menu li a.active { background: #f0f9ff; color: #0284c7; font-weight: 600; }
        .sidebar-menu li a .menu-icon { font-size: 20px; width: 28px; text-align: center; }

        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.25); display: none; z-index: 150; backdrop-filter: blur(4px); transition: opacity 0.3s; }
        .overlay.active { display: block; }

        .container { max-width: 650px; margin: 30px auto 60px auto; padding: 0 20px; }
        
        .header-section { margin-bottom: 30px; text-align: center; }
        .header-section h2 { 
            font-size: 28px; font-weight: 700; color: #0284c7; 
            background: linear-gradient(135deg, #0284c7, #0ea5e9); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .header-section p { font-size: 15px; color: #64748b; margin-top: 5px; }

        .notif-list { display: flex; flex-direction: column; gap: 14px; }
        .notif-card {
            background: #ffffff; border-radius: 20px; border: 1.5px solid rgba(186, 230, 253, 0.8);
            padding: 20px; box-shadow: 0 8px 25px rgba(14, 165, 233, 0.05); display: flex; gap: 15px; align-items: flex-start;
            transition: all 0.2s; position: relative;
        }
        .notif-card.unread { border-color: #0ea5e9; background: #fdf8ff; }
        .notif-icon { font-size: 24px; background: #e0f2fe; width: 45px; height: 45px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .notif-content { flex: 1; }
        .notif-title { font-weight: 700; color: #0369a1; font-size: 16px; margin-bottom: 4px; }
        .notif-msg { font-size: 14px; color: #475569; line-height: 1.5; margin-bottom: 8px; }
        .notif-date { font-size: 12px; color: #94a3b8; }
        
        .btn-clear {
            background: #ef4444; color: #fff; border: none; padding: 10px 20px; border-radius: 14px;
            font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; margin-bottom: 20px; display: block; margin-left: auto;
            box-shadow: 0 4px 15px rgba(239, 68, 68, 0.2);
        }
        .btn-clear:hover { background: #dc2626; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="navbar">
        <div class="nav-left">
            <button class="menu-btn" id="menuToggle" onclick="playClickSound()">&#9776;</button>
            <div class="logo-container">
                <img src="logo-ai.png" alt="Baby Go AI Logo" class="main-logo-img">
            </div>
        </div>
        <div class="nav-right">
            <a href="notifications.html" class="icon-btn" title="ศูนย์แจ้งเตือน" onclick="playClickSound()">&#128276;</a>
            <a href="profile.html" class="icon-btn" id="profileNavBtn" title="โปรไฟล์" onclick="playClickSound()">&#128100;</a>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
    
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>เมนูหลัก</h3>
            <button class="close-btn" id="closeMenu" onclick="playClickSound()">&#10005;</button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="content.html" onclick="playClickSound()"><span class="menu-icon">🏠</span> หน้าแรก</a></li>
            <li><a href="development.html" onclick="playClickSound()"><span class="menu-icon">📈</span> พัฒนาการเด็ก</a></li>
            <li><a href="vaccine.html" onclick="playClickSound()"><span class="menu-icon">💉</span> วัคซีน</a></li>
            <li><a href="nutrition.html" onclick="playClickSound()"><span class="menu-icon">🍲</span> โภชนาการ</a></li>
            <li><a href="knowledge.html" onclick="playClickSound()"><span class="menu-icon">📚</span> ความรู้</a></li>
            <li><a href="ai_assistant.html" onclick="playClickSound()"><span class="menu-icon">🤖</span> AI วิเคราะห์</a></li>
            <li><a href="community.html" onclick="playClickSound()"><span class="menu-icon">💬</span> ชุมชน</a></li>
            <li><a href="contact.html" onclick="playClickSound()"><span class="menu-icon">📞</span> ติดต่อเรา</a></li>
            
            <li id="adminMenuLink" style="display: none;">
                <a href="admin.html" onclick="playClickSound()" style="background: #fdf4ff; color: #d946ef; font-weight: 700;">
                    <span class="menu-icon">⚙️</span> หลังบ้านแอดมิน
                </a>
            </li>

            <li><a href="login.html" onclick="localStorage.removeItem('userEmail'); playClickSound();" style="color: #ef4444;"><span class="menu-icon">🚪</span> ออกจากระบบ</a></li>
        </ul>
    </div>

    <div class="container animated-fade">
        <div class="header-section">
            <h2>ศูนย์แจ้งเตือน</h2>
            <p>ติดตามความเคลื่อนไหว ข้อความตอบกลับจากแอดมิน และการแจ้งเตือนต่างๆ</p>
        </div>

        <div id="clearBtnContainer"></div>
        <div class="notif-list" id="notifListContainer"></div>
    </div>

    <script>
        let audioCtx = null;
        function playClickSound() {
            try {
                if (!audioCtx) { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
                if (audioCtx.state === 'suspended') { audioCtx.resume(); }
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(900, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.06);
            } catch (err) { console.log("Audio not supported", err); }
        }

        const menuToggle = document.getElementById('menuToggle');
        const closeMenu = document.getElementById('closeMenu');
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        function toggleMenu() { sidebar.classList.toggle('active'); overlay.classList.toggle('active'); }
        menuToggle.addEventListener('click', toggleMenu);
        closeMenu.addEventListener('click', toggleMenu);
        overlay.addEventListener('click', toggleMenu);

        const ADMIN_EMAIL = 'babygo.admin@gmail.com';

        window.addEventListener('DOMContentLoaded', () => {
            const currentEmail = localStorage.getItem('userEmail') || 'guest@babygo.com';
            const safeKey = currentEmail.replace(/[@.]/g, '_');

            // โหลดรูปโปรไฟล์
            const savedImg = localStorage.getItem('userProfileImg_' + safeKey);
            if (savedImg) {
                const profileNavBtn = document.getElementById('profileNavBtn');
                if (profileNavBtn) {
                    profileNavBtn.innerHTML = `<img src="${savedImg}" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">`;
                }
            }

            // แสดงเมนูแอดมินถ้าใช่
            if (currentEmail.toLowerCase() === ADMIN_EMAIL) {
                const adminLink = document.getElementById('adminMenuLink');
                if (adminLink) adminLink.style.display = 'block';
            }

            // ล้างสถานะจุดแดงแจ้งเตือนเมื่อเปิดเข้ามาหน้านี้
            localStorage.removeItem('babyGoHasNewNotification_' + safeKey);

            loadNotifications(safeKey);
        });

        function loadNotifications(safeKey) {
            const container = document.getElementById('notifListContainer');
            const clearContainer = document.getElementById('clearBtnContainer');
            
            let notifs = JSON.parse(localStorage.getItem('userNotifications_' + safeKey)) || [];

            if (notifs.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: #94a3b8; padding: 40px;">ไม่มีการแจ้งเตือนในขณะนี้</div>`;
                clearContainer.innerHTML = '';
                return;
            }

            clearContainer.innerHTML = `<button class="btn-clear" onclick="playClickSound(); clearAllNotifications('${safeKey}')">ล้างการแจ้งเตือนทั้งหมด</button>`;

            let html = '';
            notifs.forEach(n => {
                html += `
                    <div class="notif-card animated-fade">
                        <div class="notif-icon">${n.icon || '🔔'}</div>
                        <div class="notif-content">
                            <div class="notif-title">${n.title}</div>
                            <div class="notif-msg">${n.message}</div>
                            <div class="notif-date">${n.date}</div>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function clearAllNotifications(safeKey) {
            if (confirm('คุณต้องการลบประวัติการแจ้งเตือนทั้งหมดใช่หรือไม่?')) {
                localStorage.removeItem('userNotifications_' + safeKey);
                loadNotifications(safeKey);
            }
        }
    </script>
</body>
</html>
