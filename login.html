<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบสมาชิก - Baby Go</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Prompt', sans-serif; }
        body.login-page {
            margin: 0; padding: 0;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
        }
        .login-container { width: 100%; max-width: 420px; padding: 20px; }
        .login-box {
            background: #ffffff; padding: 35px 30px;
            border-radius: 16px; box-shadow: 0 10px 25px rgba(2, 132, 199, 0.15);
            border: 1px solid #e0f2fe;
        }
        .login-box h2 {
            text-align: center; color: #0369a1; margin-bottom: 25px;
            font-weight: 600; font-size: 26px;
        }
        .input-group { margin-bottom: 16px; }
        .input-group input {
            width: 100%; padding: 12px 16px;
            border: 1.5px solid #cbd5e1; border-radius: 8px;
            font-size: 15px; color: #334155; transition: all 0.3s ease;
        }
        .input-group input:focus {
            border-color: #0284c7; outline: none;
            box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.15);
        }
        .remember-me {
            display: flex; align-items: center; margin-bottom: 20px; font-size: 14px; color: #475569;
        }
        .remember-me input { margin-right: 8px; accent-color: #0284c7; }
        .btn-submit {
            width: 100%; padding: 12px; background-color: #0284c7;
            color: white; border: none; border-radius: 8px; font-size: 16px;
            font-weight: 500; cursor: pointer; transition: background 0.3s;
        }
        .btn-submit:hover { background-color: #0369a1; }
        .login-links {
            text-align: center; margin: 18px 0; font-size: 14px;
        }
        .login-links a { color: #0284c7; text-decoration: none; }
        .login-links a:hover { text-decoration: underline; }
        .divider { border: none; border-top: 1px solid #e2e8f0; margin: 20px 0; }
        .btn-register, .btn-back {
            display: block; text-align: center; width: 100%; padding: 10px;
            border-radius: 8px; text-decoration: none; font-size: 15px; margin-top: 10px;
            transition: all 0.3s;
        }
        .btn-register { background-color: #f1f5f9; color: #334155; border: 1px solid #cbd5e1; }
        .btn-register:hover { background-color: #e2e8f0; }
        .btn-back { color: #64748b; background: transparent; }
        .btn-back:hover { color: #0f172a; }
    </style>
</head>
<body class="login-page">

    <div class="login-container">
        <div class="login-box">
            <h2>เข้าสู่ระบบสมาชิก</h2>
            
            <form id="loginForm">
                <div class="input-group">
                    <input type="text" id="loginUserInput" placeholder="Email หรือ เบอร์โทรศัพท์" required>
                </div>
                
                <div class="input-group">
                    <input type="password" id="loginPassword" placeholder="Password" required>
                </div>
                
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">จดจำบัญชีและรหัสผ่าน</label>
                </div>
                
                <button type="submit" class="btn-submit">เข้าสู่ระบบ</button>
            </form>

            <div class="login-links">
                <a href="forgot-password.html">ลืมรหัสผ่าน?</a>
            </div>

            <hr class="divider">

            <a href="register.html" class="btn-register">สมัครสมาชิกใหม่</a>
            <a href="content.html" class="btn-back">กลับหน้าแรก</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2QNZSSDXnIuHTFVFQn8gzx7JBWTRn8i0",
            authDomain: "babygo-database-c51bb.firebaseapp.com",
            projectId: "babygo-database-c51bb",
            storageBucket: "babygo-database-c51bb.firebasestorage.app",
            messagingSenderId: "288446121324",
            appId: "1:288446121324:web:d565a8b27893e761a8df49"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // ล็อกเมลแอดมินไว้ตายตัว
        const ADMIN_EMAIL = "babygo.admin@gmail.com"; 

        document.getElementById("loginForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            let userInput = document.getElementById("loginUserInput").value.trim();
            const password = document.getElementById("loginPassword").value;

            let loginEmail = userInput;
            if (!userInput.includes("@")) {
                loginEmail = userInput + "@babygo.com"; 
            }

            try {
                await signInWithEmailAndPassword(auth, loginEmail, password);
                
                // ถ้ารหัสแอดมินถูกต้อง พุ่งไปหน้าแอดมินทันที
                if (loginEmail.toLowerCase() === ADMIN_EMAIL || (auth.currentUser && auth.currentUser.email.toLowerCase() === ADMIN_EMAIL)) {
                    alert("เข้าสู่ระบบแอดมินสูงสุดสำเร็จ!");
                    window.location.href = "admin.html";
                } else {
                    alert("เข้าสู่ระบบสำเร็จ!");
                    window.location.href = "content.html";
                }

            } catch (error) {
                alert("เข้าสู่ระบบไม่สำเร็จ: อีเมล/เบอร์โทร หรือรหัสผ่านไม่ถูกต้อง");
            }
        });
    </script>
</body>
</html>
